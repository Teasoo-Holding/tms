name: Web deploy

# Deploys the web portal (landing page, dashboards, client links) to Vercel production on every merge to master
# that changes the web app, so nobody has to redeploy by hand.
#
# One-time setup (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN       a token from vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID      "orgId" and "projectId" from .vercel/project.json after running `vercel link` once,
#   VERCEL_PROJECT_ID  or from the project's Settings → General page on vercel.com
# Without them the job explains what is missing and does nothing else.
# Routing comes from vercel.json (repository root, or web/vercel.json when the Vercel project's root directory is web).

on:
  push:
    branches: [master]
    paths: ['web/**', 'vercel.json', '.github/workflows/web-deploy.yml']
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true # only the newest version matters

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Web deploy skipped: add the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets (see the top of .github/workflows/web-deploy.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 20

      - name: Build and deploy to production
        if: steps.config.outputs.ready == 'true'
        run: |
          npm install --global vercel@39.3.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

name: Web deploy

# Deploys the web portal (landing page, dashboards, client links) to Vercel production on every merge to master
# that changes the web app, so nobody has to redeploy by hand.
#
# One-time setup (Settings → Secrets and variables → Actions → Secrets):
#   VERCEL_TOKEN       a token from vercel.com → Account Settings → Tokens
#   VERCEL_ORG_ID      "orgId" and "projectId" from .vercel/project.json after running `vercel link` once,
#   VERCEL_PROJECT_ID  or from the project's Settings → General page on vercel.com
# Without them the job explains what is missing and does nothing else.
# Routing comes from vercel.json (repository root, or web/vercel.json when the Vercel project's root directory is web).

on:
  push:
    branches: [master]
    paths: ['web/**', 'vercel.json', '.github/workflows/web-deploy.yml']
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: true # only the newest version matters

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Web deploy skipped: add the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID secrets (see the top of .github/workflows/web-deploy.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 20

      # Says which secret is wrong when Vercel can't find the project. Prints names and yes/no only, never the IDs or token
      # (this repository's logs are public).
      - name: Check Vercel access
        if: steps.config.outputs.ready == 'true'
        run: |
          api() { curl -s -o /tmp/body -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          code=$(api /v2/user)
          case "$code" in
            200) echo "Token belongs to: $(jq -r '.user.username' /tmp/body)" ;;
            401) echo "::error::Vercel rejected VERCEL_TOKEN (HTTP 401: expired, deleted or mistyped). Create a new token under Account Settings → Tokens and paste it again with no spaces or line breaks."; exit 1 ;;
            *) echo "Token can't read the account (HTTP $code), e.g. a team-only token; checking the project instead." ;;
          esac
          api /v2/teams > /dev/null
          echo "Teams this token can see: $(jq -r '[.teams[]?.name] | join(", ") | if . == "" then "none" else . end' /tmp/body)"
          case "$VERCEL_ORG_ID" in team_*) scope="?teamId=$VERCEL_ORG_ID" ;; *) scope="" ;; esac
          if [ "$(api "/v9/projects/$VERCEL_PROJECT_ID$scope")" = 200 ]; then
            echo "Project found: $(jq -r '.name' /tmp/body) (root directory: $(jq -r '.rootDirectory // "repository root"' /tmp/body))"
            exit 0
          fi
          if [ -n "$scope" ] && [ "$(api "/v9/projects/$VERCEL_PROJECT_ID")" = 200 ]; then
            echo "::error::The project is under your personal Vercel account, not the team in VERCEL_ORG_ID. Set VERCEL_ORG_ID to your account ID (Account Settings → General → Vercel ID)."
          else
            echo "::error::Vercel can't find VERCEL_PROJECT_ID with this token in VERCEL_ORG_ID. Check the project ID (project Settings → General, prj_…), the team ID (Team Settings → General, team_…), and that the token's scope includes that team."
          fi
          exit 1

      - name: Build and deploy to production
        if: steps.config.outputs.ready == 'true'
        run: |
          npm install --global vercel@39.3.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

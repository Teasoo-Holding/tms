openapi: 3.1.0
info:
  title: Tree Management System API
  version: 1.0.0
  description: |
    HTTPS API and sync gateway for TMS Phase 1. All paths are under `/api/v1`. Every endpoint except
    login, refresh, logout and health requires `Authorization: Bearer <access token>`; role, project
    and area authorisation is enforced server-side.

    Errors use `{ code, message, details? }`. `message` is written for the end user and says what to do next.
servers:
  - url: /api/v1
security:
  - bearer: []

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [VALIDATION_FAILED, FORBIDDEN, TOKEN_EXPIRED] }
        message: { type: string }
        details: {}
    Tokens:
      type: object
      required: [access_token, refresh_token, offline_valid_until, user]
      properties:
        access_token: { type: string }
        access_token_expires_in: { type: integer, description: seconds }
        refresh_token: { type: string, description: Rotating; reuse of a spent token revokes the whole family. }
        refresh_token_expires_at: { type: string, format: date-time }
        offline_valid_until: { type: string, format: date-time, description: End of the offline access window; the device must revalidate online after this. }
        user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        role: { enum: [ADMIN, FIELD_OFFICER, EXECUTIVE] }
    GeoJsonPolygon:
      type: object
      description: WGS 84 (EPSG:4326) longitude/latitude; validated with PostGIS ST_IsValid.
      required: [type, coordinates]
      properties:
        type: { const: Polygon }
        coordinates: { type: array, items: { type: array, items: { type: array, items: { type: number } } } }
    Area:
      type: object
      required: [name, short_code, reference_latitude, reference_longitude]
      properties:
        name: { type: string }
        short_code: { type: string, pattern: '^[A-Za-z0-9]{1,16}$' }
        description: { type: [string, 'null'] }
        reference_latitude: { type: number, minimum: -90, maximum: 90 }
        reference_longitude: { type: number, minimum: -180, maximum: 180 }
        boundary: { oneOf: [{ $ref: '#/components/schemas/GeoJsonPolygon' }, { type: 'null' }] }
        active: { type: boolean }
    IdScheme:
      type: object
      required: [components, separator, serial_width, serial_uniqueness_scope]
      properties:
        components:
          type: array
          description: Ordered; SERIAL must be last and required.
          items:
            type: object
            properties:
              type:
                enum: [PROJECT_CODE, PLANTING_YEAR, VENDOR_CODE, SECTOR_CODE, SUB_SECTOR_CODE, TEXT, SERIAL]
                description: VENDOR_CODE is the short code of the tree's vendor (registration then requires vendor_id).
              required: { type: boolean }
              value: { type: string, description: The text, for TEXT parts (1–16 letters or digits). }
        separator: { enum: ['-', '_', '/', '.', ''] }
        serial_width: { type: integer, minimum: 1, maximum: 12 }
        serial_uniqueness_scope:
          type: array
          description: >-
            Empty array means serials are unique globally. Usual choice is [PROJECT, PLANTING_YEAR, VENDOR] with VENDOR_CODE in the ID
            (each vendor numbers its trees from 1 per project and year). With VENDOR in the scope, registration requires vendor_id.
          items: { enum: [PROJECT, PLANTING_YEAR, VENDOR, SECTOR, SUB_SECTOR] }
    CreateTree:
      type: object
      required: [id, project_id, planting_year_id, sector_id, sub_sector_id, species_id, id_scheme_id, serial_input, initial_observation]
      description: No tree-level GPS is accepted or required.
      properties:
        id: { type: string, format: uuid, description: Generated on the device; idempotency key. }
        project_id: { type: string, format: uuid }
        planting_year_id: { type: string, format: uuid }
        sector_id: { type: string, format: uuid }
        sub_sector_id: { type: string, format: uuid }
        species_id: { type: string, format: uuid }
        vendor_id:
          type: [string, 'null']
          format: uuid
          description: >-
            Who planted and tagged the tree. Required when the format has a VENDOR_CODE part or VENDOR serial scope (rejected VENDOR_REQUIRED);
            the vendor must be active (VENDOR_INVALID), have a short code (VENDOR_CODE_MISSING) and, when the planting year has active vendor
            links, be one of them (VENDOR_NOT_IN_YEAR). Rejections are REJECTED results in sync batches and 422 on POST /trees.
        id_scheme_id: { type: string, format: uuid, description: The scheme version the device used (may since be superseded). }
        serial_input: { type: string, description: Digits from the label; zero-padded by the server. }
        physical_tree_id: { type: string, description: Full ID the officer confirmed; must equal the assembled ID. }
        id_component_values: { type: object, additionalProperties: { type: [string, 'null'] }, description: Codes the device assembled the prefix from. }
        replaces_tree_id: { type: [string, 'null'], format: uuid }
        planted_on: { type: [string, 'null'], format: date, description: Optional; when omitted the date part of initial_observation.observed_at is stored. }
        notes: { type: [string, 'null'] }
        client_recorded_at: { type: string, format: date-time }
        initial_observation:
          type: object
          required: [id, status_id, observed_at]
          properties:
            id: { type: string, format: uuid }
            status_id: { type: string, format: uuid }
            observed_at: { type: string, format: date-time, description: Stamped by the device. }
            remarks: { type: [string, 'null'] }
            visit_type: { enum: [VISIT, FIRST_INSTANCE, PLANTING, MAINTENANCE, null], default: VISIT, description: Optional; omitted or null means VISIT. }
            field_session_id: { type: [string, 'null'], format: uuid, description: Optional; one per field session on the phone, for the field-activity report. }
    DensityStats:
      type: object
      required: [registered_trees, alive_trees, dead_trees, unknown_trees, area_hectares, trees_per_hectare, alive_share]
      properties:
        registered_trees: { type: integer }
        alive_trees: { type: integer }
        dead_trees: { type: integer }
        unknown_trees: { type: integer }
        area_hectares: { type: [number, 'null'], description: Rounded to 4 decimals; null without an outline. }
        trees_per_hectare: { type: [number, 'null'], description: Rounded to 1 decimal; null without an area. }
        alive_share: { type: [number, 'null'], description: '0..1, rounded to 3 decimals: alive / (alive + dead).' }
    DensityArea:
      allOf:
        - $ref: '#/components/schemas/DensityStats'
        - type: object
          required: [kind, id, short_code, name, active, reference_latitude, reference_longitude, boundary]
          properties:
            kind: { enum: [sector, sub_sector] }
            id: { type: string, format: uuid }
            short_code: { type: string }
            name: { type: string }
            active: { type: boolean, description: Inactive areas appear only while they still hold trees. }
            reference_latitude: { type: number }
            reference_longitude: { type: number }
            boundary: { oneOf: [{ $ref: '#/components/schemas/GeoJsonPolygon' }, { type: 'null' }] }
            planting_year_id: { type: [string, 'null'], format: uuid, description: Sectors only. }
            year_label: { type: [string, 'null'], description: Sectors only. }
            sector_id: { type: string, format: uuid, description: Sub-sectors only. }
            sub_sectors: { type: array, items: { $ref: '#/components/schemas/DensityArea' }, description: Sectors only. }
    DensityMap:
      type: object
      required: [generated_at, project, planting_year, totals, sectors]
      properties:
        generated_at: { type: string, format: date-time }
        project: { type: object, properties: { id: { type: string, format: uuid }, name: { type: string }, short_code: { type: string } } }
        planting_year: { oneOf: [{ type: object, properties: { id: { type: string, format: uuid }, year_label: { type: string } } }, { type: 'null' }] }
        totals: { $ref: '#/components/schemas/DensityStats', description: Sums over the listed sectors (area = sum of sector areas). }
        sectors: { type: array, items: { $ref: '#/components/schemas/DensityArea' } }
    Observation:
      type: object
      required: [id, observed_status_id, observed_at]
      properties:
        id: { type: string, format: uuid }
        tree_id: { type: string, format: uuid }
        observed_status_id: { type: string, format: uuid }
        observed_at: { type: string, format: date-time }
        recorded_at: { type: string, format: date-time }
        remarks: { type: [string, 'null'] }
        amends_observation_id: { type: [string, 'null'], format: uuid, description: Set for audited corrections; the original is kept and marked superseded. }
        amendment_reason: { type: [string, 'null'] }
        visit_type: { enum: [VISIT, FIRST_INSTANCE, PLANTING, MAINTENANCE, null], default: VISIT, description: Optional; omitted or null means VISIT. }
        field_session_id: { type: [string, 'null'], format: uuid, description: Optional; one per field session on the phone, for the field-activity report. }
    OperationResult:
      type: object
      required: [status]
      properties:
        operation_id: { type: string, format: uuid }
        status: { enum: [ACCEPTED, ALREADY_PROCESSED, CONFLICT, REJECTED] }
        original_status: { enum: [ACCEPTED, CONFLICT, REJECTED], description: For ALREADY_PROCESSED, the outcome of the first submission. }
        code:
          type: string
          examples: [DUPLICATE_PHYSICAL_ID, DUPLICATE_SERIAL, DUPLICATE_REPLACEMENT, REVISION_MISMATCH, ID_MISMATCH, AREA_NOT_ASSIGNED, SERIAL_NOT_ALLOCATED, ORIGINAL_NOT_REPLACEABLE, TREE_NOT_FOUND]
        message: { type: string }
        entity_id: { type: string, format: uuid }
        entity: { type: object, description: Current server state of the entity. }
        conflict_id: { type: string, format: uuid }
        existing_entity_id: { type: string, format: uuid }
    Operation:
      type: object
      required: [operation_id, entity_type, entity_id, operation_type, client_recorded_at, payload]
      properties:
        operation_id: { type: string, format: uuid, description: Idempotency key; retries return the stored result. }
        entity_type: { enum: [tree, observation] }
        entity_id: { type: string, format: uuid }
        operation_type: { enum: [create, update, observation, amendment] }
        base_revision: { type: [integer, 'null'], description: Required for tree updates (optimistic concurrency). }
        client_recorded_at: { type: string, format: date-time }
        payload: { type: object, description: 'CreateTree; {id, changes{species_id, vendor_id, planted_on, notes}}; or Observation.' }
    SpeciesImage:
      type: object
      description: A reference photo of a species. Global reference data, synced to every signed-in user.
      required: [id, species_id, sort_order, caption, width, height, byte_size, updated_at]
      properties:
        id: { type: string, format: uuid }
        species_id: { type: string, format: uuid }
        sort_order: { type: integer, description: Display order within the species (then by upload time). }
        caption: { type: [string, 'null'] }
        width: { type: [integer, 'null'], description: Of the stored full image (JPEG within 1600 × 1600 px). }
        height: { type: [integer, 'null'] }
        byte_size: { type: [integer, 'null'], description: Of the stored full image. }
        updated_at: { type: string, format: date-time }
    MediaVerification:
      type: object
      properties:
        media_id: { type: string, format: uuid }
        upload_state: { enum: [PENDING, VERIFIED, FAILED] }
        failure_reason: { enum: [OBJECT_MISSING, SIZE_MISMATCH, CHECKSUM_MISMATCH, null] }
        checksum_sha256: { type: string }
        byte_size: { type: integer }
        remote_verified_at: { type: [string, 'null'], format: date-time }
        association_verified_at: { type: [string, 'null'], format: date-time }
        safe_to_delete_local_copy: { type: boolean }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  /auth/login:
    post:
      summary: Authenticate (rate limited). Registers or updates the device when device_id is sent.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
                device_id: { type: string, format: uuid }
                device_name: { type: string }
                app_version: { type: string }
      responses:
        '200': { description: Tokens, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      summary: Rotate the refresh token.
      security: []
      requestBody: { content: { application/json: { schema: { type: object, properties: { refresh_token: { type: string } } } } } }
      responses:
        '200': { description: New tokens, content: { application/json: { schema: { $ref: '#/components/schemas/Tokens' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post: { summary: Revoke the session family, security: [], responses: { '204': { description: Signed out } } }
  /auth/me:
    get: { summary: Current user, responses: { '200': { description: User, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } } } }

  /mobile/bootstrap:
    get:
      summary: Assigned projects, ID schemes, planting years, areas (with boundaries), reference data and a change cursor.
      description: >-
        Read in one REPEATABLE READ snapshot, so the cursor is consistent with the data. Reference data includes
        species, statuses, vendors and species_images (every SpeciesImage; fetch the bytes from /species-images/{id}/content).
      responses: { '200': { description: Bootstrap payload } }
  /mobile/trees:
    get:
      summary: Trees (and observations) in the caller's area scope, keyset-paginated.
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: after_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, maximum: 1000, default: 500 } }
      responses: { '200': { description: '{ trees, observations, next_after_id }' } }
  /sync/batches:
    post:
      summary: Submit outbox operations. Applied in order, each in its own transaction, with item-level results.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [device_id, operations]
              properties:
                device_id: { type: string, format: uuid }
                operations: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/Operation' } }
      responses:
        '200':
          description: Results
          content:
            application/json:
              schema:
                type: object
                properties:
                  batch_id: { type: string, format: uuid }
                  server_time: { type: string, format: date-time }
                  results: { type: array, items: { $ref: '#/components/schemas/OperationResult' } }
  /sync/changes:
    get:
      summary: Authorised changes after a server-issued cursor (gap-free, in commit order).
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 2000 } }
      responses:
        '200':
          description: >-
            { changes: [{ seq, entity_type, data, deleted? }], next_cursor, has_more, assignment_fingerprint }. A changed fingerprint means
            the device should re-bootstrap. Deleted rows arrive as tombstones ({ deleted: true, data: { id } }). entity_type species_image
            carries a SpeciesImage.

  /projects:
    get: { summary: Projects visible to the caller, responses: { '200': { description: Projects } } }
    post:
      summary: Create project (admin). physical_id_uniqueness (GLOBAL or PROJECT) must be chosen explicitly and is fixed.
      responses: { '201': { description: Project }, '400': { $ref: '#/components/responses/Error' } }
  /projects/{id}:
    get: { summary: Project with planting years and ID scheme versions, responses: { '200': { description: Project } } }
    patch: { summary: Update project (admin). Short-code changes affect future IDs only., responses: { '200': { description: Project } } }
  /projects/{id}/planting-years:
    post: { summary: Create planting year or cohort (admin), responses: { '201': { description: Planting year } } }
  /planting-years/{id}:
    patch: { summary: Open/close or re-date a planting year (admin; the label is fixed), responses: { '200': { description: Planting year } } }
  /projects/{id}/tree-id-schemes:
    post:
      summary: Publish a new version of the project's ID format (admin); it becomes current for new registrations.
      description: >-
        One format per project, shared by all vendors and planting years (a new project starts with PROJECT_CODE-PLANTING_YEAR-VENDOR_CODE-SERIAL,
        6 digits, numbered per project + planting year + vendor, e.g. T4L-2026-KNM-000001). vendor_id or planting_year_id in the body is refused with 400 VENDOR_FORMAT_RETIRED /
        YEAR_FORMAT_RETIRED. Earlier versions stay as history; registered IDs never change.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/IdScheme' } } } }
      responses: { '201': { description: Scheme version }, '400': { $ref: '#/components/responses/Error' } }
  /projects/{id}/custom-fields:
    get: { summary: Administrator-defined extra fields for trees and observations (including deactivated), responses: { '200': { description: Field definitions } } }
    post:
      summary: >-
        Add a field (admin). Body {applies_to TREE|OBSERVATION, label, field_type TEXT|NUMBER|DATE|SELECT|BOOLEAN, options, required, sticky,
        help_text, sort_order, active}. The key is derived from the label; key and type are immutable. Values are stored in custom_fields
        on trees/observations; sync refuses unknown keys or wrong types but accepts missing required values from older devices.
      responses: { '201': { description: Field definition }, '400': { $ref: '#/components/responses/Error' } }
  /custom-fields/{id}:
    patch: { summary: 'Edit label, options, required, sticky, help text, order, or deactivate (admin)', responses: { '200': { description: Field definition } } }
  /projects/{id}/areas:
    get: { summary: Sectors with sub-sectors (GeoJSON boundaries), responses: { '200': { description: Areas } } }
  /projects/{id}/areas.geojson:
    get: { summary: GeoJSON export of area boundaries and reference points, responses: { '200': { description: FeatureCollection } } }
  /projects/{id}/areas/import:
    post: { summary: All-or-nothing GeoJSON import of sectors and sub-sectors (admin), responses: { '201': { description: '{ created }' } } }
  /projects/{id}/sectors:
    post:
      summary: Create sector (admin)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Area' } } } }
      responses: { '201': { description: Sector } }
  /sectors/{id}:
    patch: { summary: Update sector (admin), responses: { '200': { description: Sector } } }
  /sectors/{id}/sub-sectors:
    post:
      summary: Create sub-sector (admin). The boundary must lie within the sector boundary.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Area' } } } }
      responses: { '201': { description: Sub-sector } }
  /sub-sectors/{id}:
    patch: { summary: Update sub-sector (admin), responses: { '200': { description: Sub-sector } } }
  /tree-species:
    get: { summary: Species, responses: { '200': { description: Species } } }
    post: { summary: Create species (admin), responses: { '201': { description: Species } } }
  /tree-species/{id}:
    patch: { summary: Update or deactivate species (admin), responses: { '200': { description: Species } } }
    delete: { summary: Delete an unused species (admin) with its reference photos, responses: { '200': { description: Deleted }, '409': { description: IN_USE } } }
  /admin/species/{speciesId}/images:
    post:
      summary: Upload reference photos of a species (admin)
      description: >-
        One or more "file" parts (JPEG, PNG or WebP, at most 15 MB each, up to 20 per request). Each is turned upright from its EXIF
        orientation and stored as a JPEG within 1600 × 1600 px, with a thumbnail within 400 × 400 px. New photos go after the existing ones.
      parameters: [{ name: speciesId, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: array, items: { type: string, format: binary } } } }
      responses:
        '201':
          description: Stored photos
          content: { application/json: { schema: { type: object, properties: { images: { type: array, items: { $ref: '#/components/schemas/SpeciesImage' } } } } } }
        '400': { description: 'IMAGE_REQUIRED, IMAGE_TYPE_UNSUPPORTED, IMAGE_TOO_LARGE or IMAGE_INVALID', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not an administrator }
        '404': { description: Species not found }
  /admin/species-images/{id}:
    patch:
      summary: Reorder or caption a species photo (admin)
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { sort_order: { type: integer }, caption: { type: [string, 'null'], maxLength: 500 } } }
      responses: { '200': { description: Photo, content: { application/json: { schema: { $ref: '#/components/schemas/SpeciesImage' } } } }, '404': { description: Not found } }
    delete:
      summary: Delete a species photo (admin); phones receive a tombstone and the stored files are removed
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses: { '204': { description: Deleted }, '404': { description: Not found } }
  /species/{speciesId}/images:
    get:
      summary: A species' reference photos, ordered by sort_order then upload time
      parameters: [{ name: speciesId, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Photos
          content: { application/json: { schema: { type: object, properties: { images: { type: array, items: { $ref: '#/components/schemas/SpeciesImage' } } } } } }
        '404': { description: Species not found }
  /species-images/{id}/content:
    get:
      summary: The photo's bytes (JPEG), served directly rather than by redirect so the bearer token stays on the request
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: size, in: query, schema: { enum: [thumb, full], default: full } }
      responses:
        '200': { description: 'JPEG image; Cache-Control: private, max-age=86400', content: { image/jpeg: { schema: { type: string, format: binary } } } }
        '404': { description: Not found }
  /tree-statuses:
    get: { summary: Statuses, responses: { '200': { description: Statuses } } }
    post: { summary: Create status (admin), responses: { '201': { description: Status } } }
  /tree-statuses/{id}:
    patch: { summary: Update or deactivate status (admin; the code is fixed), responses: { '200': { description: Status } } }
  /vendors:
    get: { summary: Vendors, responses: { '200': { description: Vendors } } }
    post: { summary: 'Create vendor (admin); short_code is required (1–16 letters or digits, stored upper-case; part of tree IDs)', responses: { '201': { description: Vendor }, '400': { $ref: '#/components/responses/Error' } } }
  /vendors/{id}:
    patch: { summary: Update or deactivate vendor (admin), responses: { '200': { description: Vendor } } }

  /trees:
    get:
      summary: Search trees in the caller's scope
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
        - { name: planting_year_id, in: query, schema: { type: string } }
        - { name: sector_id, in: query, schema: { type: string } }
        - { name: sub_sector_id, in: query, schema: { type: string } }
        - { name: species_id, in: query, schema: { type: string } }
        - { name: status_id, in: query, schema: { type: string } }
        - { name: vendor_id, in: query, schema: { type: string } }
        - { name: record_state, in: query, schema: { enum: [ACTIVE, CONFLICT, REJECTED] } }
        - { name: q, in: query, description: Physical ID substring (normalised), schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses: { '200': { description: '{ items, total, limit, offset }' } }
    post:
      summary: Register tree (same rules as a sync create)
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CreateTree' } } } }
      responses:
        '201': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/OperationResult' } } } }
        '200': { description: Already processed }
        '409': { description: Conflict (the record is preserved for review) }
        '422': { description: Rejected }
  /trees/{id}:
    get: { summary: Tree with observations, media, replacement lineage and ID history, responses: { '200': { description: Tree } } }
    patch:
      summary: Update permitted metadata with base_revision
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [base_revision, changes]
              properties:
                base_revision: { type: integer }
                changes: { type: object, properties: { species_id: { type: string }, vendor_id: { type: [string, 'null'] }, planted_on: { type: [string, 'null'] }, notes: { type: [string, 'null'] } } }
      responses: { '200': { description: Accepted }, '409': { description: REVISION_MISMATCH } }
  /trees/{id}/media:
    get:
      summary: The tree's photos, newest first (view each with /media/{id}/view-url?size=thumb or full)
      responses:
        '200':
          description: Photos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    observation_id: { type: [string, 'null'], format: uuid }
                    mime_type: { type: string }
                    byte_size: { type: [integer, 'null'] }
                    upload_state: { type: string, description: Only VERIFIED photos can be viewed. }
                    captured_at: { type: string, format: date-time }
  /trees/{id}/observations:
    post:
      summary: Append an observation or an audited amendment
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Observation' } } } }
      responses: { '201': { description: Accepted }, '422': { description: Rejected } }
  /trees/{id}/replacements:
    post:
      summary: Create a linked replacement tree with a new ID. The original's status must allow replacement.
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CreateTree' } } } }
      responses: { '201': { description: Accepted }, '409': { description: DUPLICATE_REPLACEMENT }, '422': { description: Rejected } }
  /trees/{id}/physical-id-corrections:
    post:
      summary: Audited serial correction (admin); the previous ID is kept in history
      requestBody: { content: { application/json: { schema: { type: object, required: [serial_input, reason], properties: { serial_input: { type: string }, reason: { type: string } } } } } }
      responses: { '200': { description: Corrected }, '422': { description: Duplicate or invalid } }

  /media/upload-sessions:
    post:
      summary: Register photo metadata (idempotent by media_id) and get a short-lived upload URL
      description: The tree (and observation, if given) must already be synced so the association can be verified.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [media_id, tree_id, checksum_sha256, byte_size, mime_type, captured_at]
              properties:
                media_id: { type: string, format: uuid }
                tree_id: { type: string, format: uuid }
                observation_id: { type: [string, 'null'], format: uuid }
                checksum_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                byte_size: { type: integer }
                mime_type: { enum: [image/jpeg, image/png, image/webp, image/heic] }
                captured_at: { type: string, format: date-time }
      responses:
        '201': { description: '{ media, already_verified, upload_url, upload_headers, expires_in }' }
        '409': { description: TREE_NOT_SYNCED or OBSERVATION_NOT_SYNCED }
  /media/{id}/complete:
    post:
      summary: Verify the stored object (exists, size, SHA-256 computed server-side) and its association
      responses: { '200': { description: Verification, content: { application/json: { schema: { $ref: '#/components/schemas/MediaVerification' } } } } }
  /media/{id}/view-url:
    get: { summary: Short-lived signed download URL, responses: { '200': { description: '{ url, expires_in }' } } }

  /conflicts:
    get: { summary: Conflicts (admin), responses: { '200': { description: Conflicts } } }
  /conflicts/{id}:
    get: { summary: Conflict with incoming and existing records (admin), responses: { '200': { description: Conflict } } }
  /conflicts/{id}/resolve:
    post:
      summary: Resolve with an audited decision (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [resolution, notes]
              properties:
                resolution: { enum: [REJECT_INCOMING, CORRECT_INCOMING_SERIAL, CORRECT_EXISTING_SERIAL, KEEP_UNLINKED, APPLY_INCOMING_CHANGES, KEEP_EXISTING] }
                serial_input: { type: string }
                notes: { type: string }
      responses: { '201': { description: Resolved } }

  /users:
    get: { summary: Users (admin), responses: { '200': { description: Users } } }
    post: { summary: Create user (admin; Argon2id password hashing), responses: { '201': { description: User } } }
  /users/{id}:
    patch: { summary: Update user; deactivation, role or password change revokes sessions (admin), responses: { '200': { description: User } } }
  /assignments:
    get: { summary: Project/area assignments (admin), responses: { '200': { description: Assignments } } }
    post: { summary: Assign a user to a project, sector or sub-sector (admin), responses: { '201': { description: Assignment } } }
  /assignments/{id}/revoke:
    post: { summary: Revoke assignment (admin), responses: { '201': { description: Assignment } } }
  /serial-allocations:
    get: { summary: Pre-allocated serial ranges (admin), responses: { '200': { description: Ranges } } }
    post: { summary: Allocate a non-overlapping serial range for a scope key (admin), responses: { '201': { description: Range } } }
  /serial-allocations/{id}/revoke:
    post: { summary: Revoke range (admin), responses: { '201': { description: Range } } }
  /devices:
    get: { summary: Devices with last sync and unverified photo counts (admin), responses: { '200': { description: Devices } } }
  /devices/{id}/revoke:
    post: { summary: Revoke a device and its sessions (admin), responses: { '201': { description: Device } } }
  /audit-logs:
    get:
      summary: >-
        Audit log, newest first, keyset-paginated by before_id (admin). Filters actor_id, action (prefix, e.g. tree. or observation.create),
        entity_type, entity_id, project_id, from/to (YYYY-MM-DD). Rows carry actor_name, project_name, entity_label (e.g. tree ID) and tree_id.
        Every registration (tree.create) and observation (observation.create) is logged with the device ID.
      responses: { '200': { description: Entries } }

  /reports/summary:
    get:
      summary: Dashboard metrics scoped to the caller (registered trees, not survival rates)
      parameters:
        - { name: project_id, in: query, schema: { type: string } }
        - { name: planting_year_id, in: query, schema: { type: string } }
        - { name: overdue_days, in: query, schema: { type: integer, default: 90 } }
      responses: { '200': { description: Summary including last_server_sync_at and data completeness } }
  /reports/density:
    get:
      summary: Tree density by sector and sub-sector, with outlines, for the density map (admin and executive)
      description: >-
        Trees have no GPS, so density is registered trees (active records, scoped to the caller's project/area assignments) over the
        area of the surveyed outline (ST_Area on geography). With planting_year_id: that year's sectors plus older sectors not tied to
        a year, counting only trees of that year. alive = current status recorded and not terminal; dead = terminal status;
        unknown = not observed yet. alive_share = alive / (alive + dead), null when neither. Executives need an assignment to the
        project (or all-projects access); field officers get 403.
      parameters:
        - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: planting_year_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Density map, content: { application/json: { schema: { $ref: '#/components/schemas/DensityMap' } } } }
        '400': { description: project_id missing or not a UUID }
        '403': { description: Not an administrator or executive, or not assigned to the project }
        '404': { description: Project or planting year not found (the year must belong to the project) }
  /share/{token}/density:
    get:
      summary: The same density map for a client share link's project (no sign-in)
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: planting_year_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Density map, content: { application/json: { schema: { $ref: '#/components/schemas/DensityMap' } } } }
        '404': { description: LINK_INVALID }
  /reports/field-activity:
    get:
      summary: Field activity per officer, day and field session (admin and executive)
      description: >-
        A day is the date of observed_at in tz. trees_registered = first visits (registrations), visits = later visits, corrections =
        amendments (not counted as visits), photos = tree_media rows of those observations. Records of REJECTED trees are left out.
        Observations without field_session_id form one session per officer and day (field_session_id null). A session is split per
        project and planting year. days are sorted by date desc then user_name; officers by trees_registered desc. Executives see only
        their projects (or all with all-projects access); project_id outside them gives 403.
      parameters:
        - { name: project_id, in: query, schema: { type: string, format: uuid }, description: Omitted means every project the caller can see. }
        - { name: from, in: query, schema: { type: string, format: date }, description: 'Inclusive; default 6 days before to.' }
        - { name: to, in: query, schema: { type: string, format: date }, description: 'Inclusive; default today in tz (or from + 6 days).' }
        - { name: user_id, in: query, schema: { type: string, format: uuid } }
        - { name: tz, in: query, schema: { type: string, default: UTC }, description: IANA time zone; unknown gives 400 TIME_ZONE_UNKNOWN. }
      responses:
        '200':
          description: >-
            { from, to, tz, officers: [{ user_id, user_name, role, trees_registered, visits, corrections, photos, days_active, sessions }],
            days: [{ date, user_id, user_name, trees_registered, visits, corrections, photos, first_at, last_at, sessions: [{ field_session_id,
            first_at, last_at, project_id, project_name, planting_year, sectors, sub_sectors (SECTOR/SUB), vendors (short codes), trees_registered,
            visits, corrections, photos }] }] }
        '400': { description: 'Invalid query: TIME_ZONE_UNKNOWN, DATE_INVALID, RANGE_INVALID (from after to), RANGE_TOO_LONG (over 366 days)' }
        '403': { description: Not an administrator or executive, or not assigned to the project }
  /reports/field-activity.csv:
    get: { summary: The field-activity report as CSV, one row per session (same parameters; audited), responses: { '200': { description: CSV } } }
  /share-links:
    get:
      summary: Every client share link across projects, newest first (admin)
      description: >-
        Rows { id, project_id, project_name, project_code, label, expires_at, revoked_at, last_used_at, created_at, created_by_name,
        status (ACTIVE | EXPIRED | REVOKED), path }. path is /share/<token> for an active link (the token is stored encrypted), null for
        revoked or expired links and for links created before migration 009. GET /projects/{id}/share-links returns the same rows for one project.
      responses: { '200': { description: Links }, '403': { description: Not an administrator } }
  /projects/{id}/share-links:
    get: { summary: The project's client share links (admin; same rows as /share-links), responses: { '200': { description: Links } } }
    post:
      summary: Create a client share link (admin); body { label?, expires_in_days? }
      responses: { '201': { description: '{ id, project_id, label, expires_at, created_at, token, path }' } }
  /share-links/{id}/revoke:
    post: { summary: Revoke a client share link (admin), responses: { '200': { description: '{ revoked: true }' } } }
  /share/{token}:
    get:
      summary: A client share link's project view (no sign-in); filters planting_year_id, vendor_id, sector_id, from, to
      description: >-
        { project, planting_years, vendors, areas, summary }. The summary is the dashboard summary without officer names; it includes
        by_vendor [{ id, name, short_code, count }] and planted_by_week [{ week (Monday, YYYY-MM-DD), trees, cumulative }] (planting date,
        else registration date; missing weeks filled with 0, at most 520 weeks).
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Project view }, '404': { description: LINK_INVALID } }
  /reports/trees.csv:
    get: { summary: CSV export (formula-injection safe; audited), responses: { '200': { description: CSV } } }
  /reports/trees.xlsx:
    get: { summary: Excel export (audited), responses: { '200': { description: XLSX } } }
  /health:
    get: { summary: Liveness and database check, security: [], responses: { '200': { description: OK } } }
  /health/metrics:
    get: { summary: Operational metrics for monitoring (sync, media, conflicts, devices), responses: { '200': { description: Metrics } } }
